<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mirror App - Principal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- Header -->
<header class="bg-white shadow-sm">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
        <div class="border-2 border-gray-300 rounded px-5 py-1 text-gray-500 font-semibold tracking-widest text-sm">
            LOGO
        </div>
        <div class="flex items-center gap-3">
            <span id="info-name" class="text-sm text-gray-500"></span>
            <span class="inline-block bg-blue-100 text-blue-700 text-xs font-semibold px-3 py-1 rounded-full">Principal</span>
        </div>
    </div>
</header>

<!-- Tabs -->
<div class="max-w-5xl mx-auto px-6 mt-6">
    <div class="flex border-b border-gray-200 mb-6">
        <button id="tab-devices" onclick="showTab('devices')"
                class="px-6 py-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600 -mb-px">
            Dispositivos
        </button>
        <button id="tab-folders" onclick="showTab('folders')"
                class="px-6 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 -mb-px">
            Pastas Sincronizadas
        </button>
    </div>

    <!-- Devices Tab -->
    <div id="panel-devices">

        <!-- This machine info -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">Este Dispositivo</h2>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Nome da Maquina</label>
                    <input id="self-name" type="text" readonly
                           class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-gray-700 text-sm cursor-not-allowed"/>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Endereco IP</label>
                    <input id="self-ip" type="text" readonly
                           class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-gray-700 text-sm cursor-not-allowed"/>
                </div>
            </div>
        </div>

        <!-- Secondary devices -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide">Dispositivos Secundarios</h2>
                <button onclick="loadDevices()"
                        class="text-sm text-blue-600 border border-blue-300 rounded-lg px-4 py-1.5 hover:bg-blue-50 transition">
                    Atualizar
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                    <tr class="border-b border-gray-100">
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Nome</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Endereco IP</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Status</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Acao</th>
                    </tr>
                    </thead>
                    <tbody id="devices-table">
                    <tr>
                        <td colspan="4" class="py-6 text-center text-gray-400">Carregando...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Folders Tab -->
    <div id="panel-folders" class="hidden">

        <!-- New folder form -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">Nova Pasta</h2>
            <div class="mb-4">
                <label class="block text-xs text-gray-400 mb-1">Guid</label>
                <input id="new-guid" type="text" readonly
                       class="w-full bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 text-gray-400 text-sm cursor-not-allowed font-mono"/>
            </div>
            <div class="mb-4">
                <label class="block text-xs text-gray-400 mb-1">Endereco da pasta</label>
                <div class="flex gap-2">
                    <input id="new-folder-path" type="text" placeholder="Ex: C:\Users\sync\pasta1"
                           class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400"/>
                    <button onclick="openBrowseModal('new-folder-path')"
                            class="px-4 py-2 border border-gray-300 rounded-lg text-sm text-gray-600 hover:bg-gray-50 transition">
                        Procurar
                    </button>
                </div>
            </div>
            <div class="flex justify-end">
                <button onclick="saveFolder()"
                        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition">
                    Salvar
                </button>
            </div>
            <div id="folder-save-msg" class="hidden mt-2 text-sm"></div>
        </div>

        <!-- Folders list -->
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h2 class="text-sm font-semibold text-gray-500 uppercase tracking-wide mb-4">Pastas Sincronizadas</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead>
                    <tr class="border-b border-gray-100">
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Guid</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Endereco</th>
                        <th class="text-left py-2 px-3 text-gray-500 font-medium">Acao</th>
                    </tr>
                    </thead>
                    <tbody id="folders-table">
                    <tr>
                        <td colspan="3" class="py-6 text-center text-gray-400">Nenhuma pasta cadastrada.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Directory browser modal -->
<div id="browse-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6">
        <h3 class="font-semibold text-gray-700 mb-3">Selecionar pasta</h3>
        <div class="flex gap-2 mb-3">
            <input id="browse-path" type="text" readonly
                   class="flex-1 border border-gray-200 rounded-lg px-3 py-2 text-sm bg-gray-50 text-gray-600 font-mono"/>
            <button onclick="browseUp()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm hover:bg-gray-50">
                Subir
            </button>
        </div>
        <div id="browse-list" class="border border-gray-200 rounded-lg h-64 overflow-y-auto text-sm">
            <div class="text-center text-gray-400 py-8">Carregando...</div>
        </div>
        <div class="flex gap-3 mt-4">
            <button onclick="closeBrowse()"
                    class="flex-1 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 text-sm">
                Cancelar
            </button>
            <button onclick="selectBrowsed()"
                    class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-semibold">
                Selecionar
            </button>
        </div>
    </div>
</div>

<script>
    let activeTab = 'devices';
    let browseTargetId = null;
    let currentBrowsePath = '';

    async function init() {
        const info = await fetchJson('/api/setup/info');
        if (!info || info.role !== 'MASTER') {
            window.location.href = '/';
            return;
        }
        document.getElementById('self-name').value = info.name;
        document.getElementById('self-ip').value = info.ip;
        generateGuid();
        loadDevices();
        setInterval(loadDevices, 6000);
    }

    function generateGuid() {
        document.getElementById('new-guid').value = crypto.randomUUID ? crypto.randomUUID()
            : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
    }

    function showTab(name) {
        activeTab = name;
        document.getElementById('panel-devices').classList.toggle('hidden', name !== 'devices');
        document.getElementById('panel-folders').classList.toggle('hidden', name !== 'folders');
        document.getElementById('tab-devices').className = tabClass(name === 'devices');
        document.getElementById('tab-folders').className = tabClass(name === 'folders');
        if (name === 'folders') loadFolders();
    }

    function tabClass(active) {
        return active
            ? 'px-6 py-3 text-sm font-semibold border-b-2 border-blue-600 text-blue-600 -mb-px'
            : 'px-6 py-3 text-sm font-semibold border-b-2 border-transparent text-gray-500 hover:text-gray-700 -mb-px';
    }

    async function loadDevices() {
        const devices = await fetchJson('/api/master/devices') || [];
        const tbody = document.getElementById('devices-table');
        if (devices.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="py-6 text-center text-gray-400">Nenhum dispositivo secundario conectado.</td></tr>';
            return;
        }
        tbody.innerHTML = devices.map(d => `
            <tr class="border-b border-gray-50 hover:bg-gray-50">
                <td class="py-3 px-3 text-gray-700">${d.name}</td>
                <td class="py-3 px-3 text-gray-500">${d.ipAddress}</td>
                <td class="py-3 px-3">${statusBadge(d.status)}</td>
                <td class="py-3 px-3">${actionButtons(d)}</td>
            </tr>`).join('');
    }

    function statusBadge(status) {
        const map = {
            ONLINE: 'bg-green-100 text-green-700',
            OFFLINE: 'bg-gray-100 text-gray-500',
            PAUSED: 'bg-yellow-100 text-yellow-700'
        };
        const labels = {ONLINE: 'online', OFFLINE: 'offline', PAUSED: 'pausado'};
        return `<span class="inline-block text-xs font-semibold px-2 py-0.5 rounded-full ${map[status] || ''}">${labels[status] || status}</span>`;
    }

    function actionButtons(d) {
        if (d.status === 'ONLINE') {
            return `
                <button onclick="deviceAction(${d.id},'pause')" class="text-xs px-3 py-1 rounded border border-yellow-400 text-yellow-700 hover:bg-yellow-50 mr-1">Pausar</button>
                <button onclick="deviceAction(${d.id},'disconnect')" class="text-xs px-3 py-1 rounded border border-red-400 text-red-600 hover:bg-red-50">Desconectar</button>`;
        } else if (d.status === 'PAUSED') {
            return `
                <button onclick="deviceAction(${d.id},'reactivate')" class="text-xs px-3 py-1 rounded border border-green-400 text-green-700 hover:bg-green-50 mr-1">Reativar</button>
                <button onclick="deviceAction(${d.id},'disconnect')" class="text-xs px-3 py-1 rounded border border-red-400 text-red-600 hover:bg-red-50">Desconectar</button>`;
        }
        return `<button onclick="deviceAction(${d.id},'disconnect')" class="text-xs px-3 py-1 rounded border border-red-400 text-red-600 hover:bg-red-50">Desconectar</button>`;
    }

    async function deviceAction(id, action) {
        const urls = {
            pause: `/api/master/devices/${id}/pause`,
            reactivate: `/api/master/devices/${id}/reactivate`,
            disconnect: `/api/master/devices/${id}`
        };
        const methods = {pause: 'POST', reactivate: 'POST', disconnect: 'DELETE'};
        await fetch(urls[action], {method: methods[action]});
        loadDevices();
    }

    async function loadFolders() {
        const folders = await fetchJson('/api/master/folders') || [];
        const tbody = document.getElementById('folders-table');
        if (folders.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="py-6 text-center text-gray-400">Nenhuma pasta cadastrada.</td></tr>';
            return;
        }
        tbody.innerHTML = folders.map(f => `
            <tr class="border-b border-gray-50 hover:bg-gray-50">
                <td class="py-3 px-3 text-gray-400 font-mono text-xs">${f.guid}</td>
                <td class="py-3 px-3 text-gray-700">${f.folderPath}</td>
                <td class="py-3 px-3">
                    <button onclick="deleteFolder('${f.guid}')"
                            class="text-xs px-3 py-1 rounded border border-red-400 text-red-600 hover:bg-red-50">
                        Excluir
                    </button>
                </td>
            </tr>`).join('');
    }

    async function saveFolder() {
        const guid = document.getElementById('new-guid').value;
        const folderPath = document.getElementById('new-folder-path').value.trim();
        const msgEl = document.getElementById('folder-save-msg');

        if (!folderPath) {
            showMsg(msgEl, 'Informe o endereco da pasta.', 'red');
            return;
        }

        const res = await fetch('/api/master/folders', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({folderPath})
        });

        if (res.ok) {
            showMsg(msgEl, 'Pasta salva com sucesso.', 'green');
            document.getElementById('new-folder-path').value = '';
            generateGuid();
            loadFolders();
        } else {
            showMsg(msgEl, 'Erro ao salvar pasta.', 'red');
        }
    }

    async function deleteFolder(guid) {
        if (!confirm('Excluir esta pasta da sincronizacao?')) return;
        await fetch('/api/master/folders/' + guid, {method: 'DELETE'});
        loadFolders();
    }

    function showMsg(el, text, color) {
        el.textContent = text;
        el.className = `mt-2 text-sm text-${color}-600`;
        el.classList.remove('hidden');
        setTimeout(() => el.classList.add('hidden'), 3000);
    }

    // ---- Directory browser ----
    function openBrowseModal(targetId) {
        browseTargetId = targetId;
        document.getElementById('browse-modal').classList.remove('hidden');
        browseTo('');
    }

    function closeBrowse() {
        document.getElementById('browse-modal').classList.add('hidden');
    }

    function selectBrowsed() {
        if (currentBrowsePath && browseTargetId) {
            document.getElementById(browseTargetId).value = currentBrowsePath;
        }
        closeBrowse();
    }

    function browseUp() {
        if (!currentBrowsePath) return;
        const parts = currentBrowsePath.replace(/\\/g, '/').split('/').filter(Boolean);
        parts.pop();
        browseTo(parts.length === 0 ? '' : parts.join('/'));
    }

    async function browseTo(path) {
        currentBrowsePath = path;
        document.getElementById('browse-path').value = path;
        const list = document.getElementById('browse-list');
        list.innerHTML = '<div class="text-center text-gray-400 py-8">Carregando...</div>';

        try {
            const items = await fetchJson('/api/files/browse?path=' + encodeURIComponent(path)) || [];
            if (items.length === 0) {
                list.innerHTML = '<div class="text-center text-gray-400 py-8">Pasta vazia.</div>';
                return;
            }
            list.innerHTML = items.map(item => `
                <div onclick="browseTo('${escHtml(item.path)}')"
                     class="flex items-center gap-2 px-4 py-2.5 hover:bg-blue-50 cursor-pointer border-b border-gray-50 last:border-0">
                    <svg class="w-4 h-4 text-yellow-500 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M2 6a2 2 0 012-2h4l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"/>
                    </svg>
                    <span class="text-sm text-gray-700">${escHtml(item.name)}</span>
                </div>`).join('');
        } catch (e) {
            list.innerHTML = '<div class="text-center text-red-400 py-8">Erro ao listar diretorio.</div>';
        }
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function fetchJson(url) {
        try {
            const res = await fetch(url);
            if (!res.ok) return null;
            return await res.json();
        } catch (e) {
            return null;
        }
    }

    init();
</script>
</body>
</html>
