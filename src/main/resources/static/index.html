<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mirror</title>
    <link rel="icon" type="image/svg+xml" href="img/mirror-app.svg">
    <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg border-bottom bg-body">
    <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <img src="img/mirror-app.svg" alt="Mirror logo" width="32" height="32">
            <span class="fw-bold">MIRROR</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-navbar"
                aria-controls="main-navbar" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="main-navbar">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link active" data-view="folders" href="#folders">Pastas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-view="mouse" href="#mouse">Mouse</a>
                </li>
            </ul>

            <div class="dropdown">
                <button id="server-toggle"
                        type="button"
                        class="btn btn-icon"
                        data-bs-toggle="dropdown"
                        data-bs-auto-close="outside"
                        aria-expanded="false"
                        title="Conexão com servidor">
                    <i id="server-icon" class="bi bi-pc-display-horizontal server-icon-disconnected"></i>
                </button>
                <div class="dropdown-menu dropdown-menu-end p-3 server-menu" aria-labelledby="server-toggle">
                    <div class="mb-2 d-flex justify-content-between gap-2">
                        <span class="text-muted small">Endereço local:</span>
                        <strong id="local-address" class="small">--</strong>
                    </div>
                    <hr class="my-2">

                    <div class="d-flex gap-3 mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="connection-mode"
                                   id="mode-local" value="LOCAL" checked>
                            <label class="form-check-label" for="mode-local">Local</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="connection-mode"
                                   id="mode-remote" value="REMOTE">
                            <label class="form-check-label" for="mode-remote">Remoto</label>
                        </div>
                    </div>

                    <label for="server-address-input" class="form-label small mb-1">Servidor:</label>
                    <div class="input-group input-group-sm mb-2">
                        <input type="text" class="form-control" id="server-address-input"
                               placeholder="ip do servidor" autocomplete="off">
                        <button class="btn btn-primary" id="connect-button" type="button">Conectar</button>
                    </div>

                    <div class="small">
                        Status: <span id="connection-status" class="fw-semibold">Offline</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</nav>

<main class="container-fluid py-3">
    <section id="view-folders" class="view">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 col-xxl-8">
                <div class="card mb-3">
                    <div class="card-header">Nova Pasta</div>
                    <div class="card-body">
                        <form id="folder-form" autocomplete="off" novalidate>
                            <div class="row g-2 mb-3 align-items-center">
                                <label for="folder-guid" class="col-sm-3 col-form-label col-form-label-sm">Guid</label>
                                <div class="col-sm-9">
                                    <input type="text" id="folder-guid"
                                           class="form-control form-control-sm font-monospace"
                                           readonly>
                                </div>
                            </div>
                            <div class="row g-2 mb-3 align-items-center">
                                <label for="folder-path" class="col-sm-3 col-form-label col-form-label-sm">Endereço da pasta</label>
                                <div class="col-sm-9">
                                    <div class="input-group input-group-sm">
                                        <input type="text" id="folder-path" class="form-control"
                                               placeholder="ex.: C:/caminho/da/pasta">
                                        <button type="button" class="btn btn-outline-secondary" id="folder-browse">Procurar</button>
                                    </div>
                                </div>
                            </div>
                            <div class="d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="folder-clear">Limpar</button>
                                <button type="submit" class="btn btn-sm btn-primary" id="folder-save">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">Listagem</div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-sm table-striped align-middle mb-0">
                                <thead>
                                <tr>
                                    <th scope="col">Guid</th>
                                    <th scope="col">Endereço</th>
                                    <th scope="col" class="text-end" style="width: 1%; white-space: nowrap;">Ação</th>
                                </tr>
                                </thead>
                                <tbody id="folders-table-body"></tbody>
                            </table>
                        </div>
                        <p id="folders-empty" class="text-muted small mt-3 mb-0 d-none">Nenhuma pasta cadastrada.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section id="view-mouse" class="view d-none">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-10 col-xl-9 col-xxl-8">
                <div class="card">
                    <div class="card-body">
                        <h2 class="h5 card-title">Mouse</h2>
                        <p class="text-muted mb-0">Em construção.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<div id="toast-area" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

<div class="modal fade" id="folder-picker-modal" tabindex="-1" aria-hidden="true" aria-labelledby="folder-picker-title">
    <div class="modal-dialog modal-dialog-scrollable modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="folder-picker-title">Selecionar pasta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="folder-picker-up" title="Voltar">
                        <i class="bi bi-arrow-up"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="folder-picker-roots" title="Raízes do sistema">
                        <i class="bi bi-hdd-stack"></i>
                    </button>
                    <code id="folder-picker-current" class="text-truncate flex-grow-1 p-2 bg-body-secondary rounded small">/</code>
                </div>
                <ul id="folder-picker-list" class="list-group small folder-picker-list mb-0"></ul>
                <p id="folder-picker-empty" class="text-muted small mt-2 mb-0 d-none">Nenhuma subpasta visível.</p>
                <p id="folder-picker-error" class="text-danger small mt-2 mb-0 d-none"></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-sm btn-primary" id="folder-picker-confirm" disabled>Selecionar esta pasta</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
