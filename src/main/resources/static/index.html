<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Mirror App</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center">

<div class="bg-white rounded-2xl shadow-lg p-10 w-full max-w-lg text-center">
    <div class="mb-8">
        <div class="inline-block border-2 border-gray-300 rounded px-6 py-2 text-gray-500 font-semibold text-lg tracking-widest">
            LOGO
        </div>
    </div>

    <h1 class="text-2xl font-bold text-gray-800 mb-2">Mirror App</h1>
    <p class="text-gray-500 mb-8">Selecione o papel desta maquina na rede</p>

    <div id="loading" class="text-gray-400 py-4">Verificando configuracao...</div>

    <div id="role-form" class="hidden">
        <div class="grid grid-cols-1 gap-4 mb-6">
            <button id="btn-master"
                    onclick="selectRole('MASTER')"
                    class="w-full py-5 rounded-xl border-2 border-blue-500 bg-blue-50 hover:bg-blue-100 transition text-blue-700 font-bold text-lg">
                Definir como Principal (Master)
                <p class="text-sm font-normal text-blue-500 mt-1">Esta maquina gerencia a sincronizacao</p>
            </button>
            <button id="btn-slave"
                    onclick="showSlaveForm()"
                    class="w-full py-5 rounded-xl border-2 border-green-500 bg-green-50 hover:bg-green-100 transition text-green-700 font-bold text-lg">
                Definir como Secundario (Slave)
                <p class="text-sm font-normal text-green-500 mt-1">Esta maquina sincroniza com o Principal</p>
            </button>
        </div>
    </div>

    <div id="slave-form" class="hidden text-left">
        <h2 class="text-lg font-semibold text-gray-700 mb-4">Configurar conexao com o Principal</h2>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-600 mb-1">Endereco IP do Principal</label>
            <input id="master-ip" type="text" placeholder="Ex: 192.168.0.10"
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
        </div>
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-600 mb-1">Nome do Principal (opcional)</label>
            <input id="master-name" type="text" placeholder="Ex: Computador Principal"
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
        </div>
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-600 mb-1">Porta</label>
            <input id="master-port" type="number" value="8080"
                   class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-green-400"/>
        </div>
        <div class="flex gap-3">
            <button onclick="showRoleForm()"
                    class="flex-1 py-2 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-50 transition">
                Voltar
            </button>
            <button onclick="confirmSlave()"
                    class="flex-1 py-2 rounded-lg bg-green-600 hover:bg-green-700 text-white font-semibold transition">
                Confirmar
            </button>
        </div>
    </div>

    <div id="error-msg" class="hidden mt-4 text-red-600 text-sm"></div>
    <div id="saving" class="hidden mt-4 text-gray-400 text-sm">Salvando configuracao...</div>
</div>

<script>
    async function init() {
        try {
            const res = await fetch('/api/setup/info');
            const data = await res.json();
            document.getElementById('loading').classList.add('hidden');

            if (data.role === 'MASTER') {
                window.location.href = '/master.html';
            } else if (data.role === 'SLAVE') {
                window.location.href = '/slave.html';
            } else {
                showRoleForm();
            }
        } catch (e) {
            document.getElementById('loading').textContent = 'Erro ao conectar com o servidor.';
        }
    }

    function showRoleForm() {
        document.getElementById('role-form').classList.remove('hidden');
        document.getElementById('slave-form').classList.add('hidden');
        document.getElementById('error-msg').classList.add('hidden');
    }

    function showSlaveForm() {
        document.getElementById('role-form').classList.add('hidden');
        document.getElementById('slave-form').classList.remove('hidden');
    }

    async function selectRole(role) {
        setLoading(true);
        try {
            const res = await fetch('/api/setup/role', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({role})
            });
            if (res.ok) {
                window.location.href = '/master.html';
            } else {
                const err = await res.json();
                showError(err.error || 'Erro ao configurar papel.');
            }
        } catch (e) {
            showError('Erro de comunicacao com o servidor.');
        } finally {
            setLoading(false);
        }
    }

    async function confirmSlave() {
        const masterIp = document.getElementById('master-ip').value.trim();
        const masterName = document.getElementById('master-name').value.trim();
        const masterPort = parseInt(document.getElementById('master-port').value) || 8080;

        if (!masterIp) {
            showError('Informe o endereco IP do Principal.');
            return;
        }

        setLoading(true);
        try {
            const res = await fetch('/api/setup/role', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({role: 'SLAVE', masterIp, masterName, masterPort})
            });
            if (res.ok) {
                window.location.href = '/slave.html';
            } else {
                const err = await res.json();
                showError(err.error || 'Erro ao configurar papel.');
            }
        } catch (e) {
            showError('Erro de comunicacao com o servidor.');
        } finally {
            setLoading(false);
        }
    }

    function showError(msg) {
        const el = document.getElementById('error-msg');
        el.textContent = msg;
        el.classList.remove('hidden');
    }

    function setLoading(on) {
        document.getElementById('saving').classList.toggle('hidden', !on);
    }

    init();
</script>
</body>
</html>
