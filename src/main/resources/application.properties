spring.application.name=mirror-app

server.port=8080

mirror.data-dir=${user.home}/.mirror-app

spring.datasource.url=jdbc:sqlite:${mirror.data-dir}/mirror.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.open-in-view=false

mirror.node.display-name=${COMPUTERNAME:localhost}
mirror.watch.debounce-ms=500
mirror.peer.connect-timeout-ms=5000
mirror.peer.read-timeout-ms=60000

springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.path=/swagger-ui

management.endpoints.web.exposure.include=health,metrics
